<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数当て | Kyoto Dev Circle ミニゲーム集</title>
    <link rel="stylesheet" href="../../src/style.css" />
  </head>
  <body>
    <main id="app">
      <h1>数当て</h1>
      <p id="rule"></p>

      <form id="guess-form" novalidate>
        <label for="guess-input">予想</label>
        <input id="guess-input" type="number" autocomplete="off" />
        <button type="submit" id="guess-button">予想する</button>
      </form>

      <p id="message"></p>
      <p>回数：<span id="count">0</span> 回</p>

      <div id="result" hidden>
        <p id="result-text"></p>
        <button type="button" id="retry-button">もう一度</button>
      </div>

      <a href="../../">メニューに戻る</a>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
